[project]
name = "pyawb"
version = "0.1.0.dev0"
description = "Cross-platform AutoWikiBrowser: a semi-automated MediaWiki editor"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "PyAutoWikiBrowser contributors" }]
dependencies = [
    "regex>=2024.11.6",
    "PySide6>=6.8",
    "pywikibot>=9.6",
    "keyring>=25",
]

[project.scripts]
pyawb = "pyawb.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyawb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: needs internet access (deselect with -m 'not network')"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tools/porting"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "TID"]
# Non-ASCII look-alikes are intentional in a multilingual wiki editor.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"re".msg = "Use pyawb.core.rx (the `regex` module) for all pattern matching."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["TID251"]
# converted AWB tests: out/ref arguments become assignment expressions; AWB variable names kept
"tests/parity/**" = ["TID251", "RUF018", "E741", "E711", "SIM201", "SIM202"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/pyawb/core"]
reportMissingModuleSource = false
